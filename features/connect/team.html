<!-- ===== 기능 3 · 팀 공간 (담당: 이름을 적어주세요) ===== -->
<body data-page="connect" data-root="../../">
<header id="nav"></header>

<main class="wrap">
  <a class="back" href="connect.html">← 요청·팀으로</a>
  <div id="head"></div>

  <div class="tgrid" id="body">
    <div class="tmain">
      <section class="card" id="slotsCard"></section>
      <section class="card" id="membersCard"></section>
      <section class="card" id="applicants"></section>
      <section class="card hide" id="reviewsCard"></section>
    </div>
    <aside class="tside">
      <section class="card chat" id="chatCard">
        <div class="card-h"><h2>팀 메시지</h2><span class="mute" id="chatState"></span></div>
        <div id="chatLink"></div>
        <div class="msgs" id="msgs"></div>
        <form id="msgForm" class="msg-form" autocomplete="off">
          <textarea id="msgText" rows="2" placeholder="팀원에게 남길 말 (Enter 보내기 · Shift+Enter 줄바꿈)"></textarea>
          <button class="btn pri sm" type="submit">보내기</button>
        </form>
      </section>
    </aside>
  </div>
</main>

<footer id="foot"></footer>
